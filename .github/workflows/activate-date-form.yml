name: Activate date form
on:
  push:
    paths:
      - '.github/workflows/activate-date-form.yml'
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FormSubmit activation
        run: |
          curl -sS -X POST 'https://formsubmit.co/sudritghimire@gmail.com' \
            -H 'Accept: application/json' \
            -F '_subject=Date Site Setup' \
            -F '_url=https://sudritghimire-ai.github.io/word.github.io/date/' \
            -F 'setup=Activate the private date response form' \
            -F 'message=Setup request only'
